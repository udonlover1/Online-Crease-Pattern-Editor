<!DOCTYPE html>
<html>
    <head>
        <title>Online Crease Pattern Editor</title>
        <style>
            * {
                box-sizing: border-box;
                font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                padding: 0px;
                margin: 2px;
                user-select: none;
            }
            body {
                background-color: lightgrey;
            }
            #topMenu {
                display: grid;
                text-align: center;
                justify-content: left;
            }
            #topMenu > div {
                display: flex;
                align-items: center;
                justify-content: left;
            }
            #uploadFileButton {
                height: 20px;
                width: 100px;
            }
            #resetViewbox {
                height: 20px;
                width: 100px;
            }
            #coordText {
                pointer-events: none;
            }
            #crease-display {
                user-select: none;
            }
            button > img {
                pointer-events: none;
            }
            button,input {
                width: var(--button-width);
                height: var(--button-height);
                display: flex;
                justify-content: center;
                align-items: center;
                text-align: center;
                box-shadow: none;
                padding: 0px;
                border: 1px solid black;
                background-color: white;
            }
            input[type="checkbox"] {
                width: 20px;
                height: 20px;
            }
            button.active {
                background-color: rgb(154, 151, 151);
            }
            button:active {
                background-color: rgb(175, 174, 174);
            }
            #mountain.active {
                background-color: red;
                color: white;
            }
            #valley.active {
                background-color: blue;
                color: white;
            }
            #auxiliary.active {
                background-color: rgb(174, 221, 243);
            }
            #edge.active {
                background-color: black;
                color: white;
            }
            .grid-line {
                stroke-width: var(--line-width);
                stroke: grey;
            }
            .preview-line {
                stroke-width: var(--line-width);
                stroke: rgb(206, 51, 185);
            }
            .mountain-line {
                stroke-width: var(--line-width);
                stroke: red;
            }
            .valley-line {
                stroke-width: var(--line-width);
                stroke: blue;
            }
            .auxiliary-line {
                stroke-width: var(--line-width);
                stroke: rgb(174, 221, 243);
            }
            .edge-line {
                stroke-width: var(--line-width);
                stroke: black;
            }
            .highlight-line {
                stroke-width: calc(var(--line-width)*5);
                stroke: rgb(255, 255, 0);
            }
            .flatfoldability-icon {
                fill-opacity: 0.5;
            }
        </style>
    </head>
    <body>
        <div>
            <h2>Online Crease Pattern Editor</h2>   
        </div>
        <div id="topMenu">
            <div>
                <button id="uploadFileButton" onclick="hiddenFileInput.click()">Upload File</button>
                <input id="hiddenFileInput" type="file" style="display: none;" onchange="fileUpload(event)"/>
                <p id="uploadFileName">No File Selected</p>
            </div>
            <div>
                <input id="displayVertices" type="checkbox" onchange="displayVertices()"/>
                <p>Display Vertices</p>
            </div>
            <div>
                <input id="displayEdges" type="checkbox" onchange="displayEdges()"/>
                <p>Display Edges</p>
            </div>
            <div>
                <input id="displayFF" type="checkbox" onchange="displayFF()"/>
                <p>Check Vertex Flat Foldability</p>
            </div>
            <div>
                <button id="resetViewbox" onclick="resetViewbox()">Reset Zoom</button>
            </div>
        </div>
        <div id="buttonPanel">
        </div>
        <div id="debug">
        </div>
    </body>
    <script>
        let buttonOffset = 180;
        let svgOffset = 40;
        let SVGHeight = 10000;
        let gridSize = 2;
        let epsilon = 0.00001;

        let lineWidthFactor = 0.001;
        let lineWidthFactorIncrement = 0.0002;
        let sketchMode = "line";
        let lineType = "mountain";
        let mouseMode = "up";
        let vertices = [[0,0],[10000,0],[10000,10000],[0,10000]];
        let edges_vertices = [[0,1],[1,2],[2,3],[3,0]];
        let vertices_edges = [[0,3],[0,1],[1,2],[2,3]];
        let edges_assignment = ["B","B","B","B"];
        let recentStartVertex;
        let recentStartVertexId;
        let recentEndVertex;
        let recentEndVertexId;
        let svgViewbox = {x1 : 0, y1 : 0, x2 : SVGHeight, y2 : SVGHeight}
        let pressedKey = "";
        let selectedLines = [];
        const lineWidthButton = [
            {id : "decrease-line-width", type : "button", title : "Decrease Line Width", icon : "decreaseWidth.png", functionCall : () => {changeLineWidth(0)}},
            {id : "increase-line-width", type : "button", title : "Increase Line Width", icon : "increaseWidth.png", functionCall : () => {changeLineWidth(1)}},
        ];
        const creaseButton = [
            {id : "mountain" , type : "button", title : "Mountain" , text : "M", functionCall : () => {changeLineType(event)}},
            {id : "valley"   , type : "button", title : "Valley"   , text : "V", functionCall : () => {changeLineType(event)}},
            {id : "auxiliary", type : "button", title : "Auxiliary", text : "A", functionCall : () => {changeLineType(event)}},
            {id : "edge"     , type : "button", title : "Edge"     , text : "E", functionCall : () => {changeLineType(event)}},
        ];
        const toolButton = [
            {id : "line"                , type : "button", title : "Draw Line"                , icon : "drawLine.png"            , functionCall : () => {changeSketchMode(event)}},
            {id : "restrictedLine"      , type : "button", title : "Restricted Line"          , icon : "restrictedLine.png"      , functionCall : () => {changeSketchMode(event)}},
            {id : "rabbitEar"           , type : "button", title : "Rabbit Ear"               , icon : "rabbitEar.png"           , functionCall : () => {changeSketchMode(event)}},
            {id : "flatFoldLine"        , type : "button", title : "Draw Flat Foldable Line"  , icon : "flatFoldableLine.png"    , functionCall : () => {changeSketchMode(event)}},
            {id : "extendLine"          , type : "button", title : "Extend Line"              , icon : "extendLine.png"          , functionCall : () => {changeSketchMode(event)}},
            {id : "perpendicularLine"   , type : "button", title : "Perpendicular Line"       , icon : "perpendicularLine.png"   , functionCall : () => {changeSketchMode(event)}},
            {id : "angleBisector"       , type : "button", title : "Angle Bisector"           , icon : "angleBisector.png"       , functionCall : () => {changeSketchMode(event)}},
            {id : "id4"                 , type : "button", title : "title4"                                                      , functionCall : () => {changeSketchMode(event)}},
            {id : "extendLineSameColour", type : "button", title : "Extend Line (same colour)", icon : "extendLineSameColour.png", functionCall : () => {changeSketchMode(event)}},
            {id : "alternatingLines"    , type : "button", title : "Draw Alternating Lines"   , icon : "alternatingLines.png"    , functionCall : () => {changeSketchMode(event)}},
            {id : "reflectOverLine"     , type : "button", title : "Reflect Over Line"        , icon : "reflectOverLine.png"     , functionCall : () => {changeSketchMode(event)}},
            {id : "creaseThroughLayers" , type : "button", title : "Crease Through Layers"    , icon : "creaseThroughLayers.png" , functionCall : () => {changeSketchMode(event)}},
            {id : "selectLines"         , type : "button", title : "Select Lines"             , icon : "selectLines.png"         , functionCall : () => {changeSketchMode(event)}},
            {id : "selectAll"           , type : "button", title : "Select All"               , icon : "selectAll.png"           , functionCall : () => {changeSketchMode(event)}},
            {id : "unselectLines"       , type : "button", title : "Unselect Lines"           , icon : "unselectLines.png"       , functionCall : () => {changeSketchMode(event)}},
            {id : "deselectAll"         , type : "button", title : "Deselect All"             , icon : "deselectAll.png"         , functionCall : () => {changeSketchMode(event)}},
            {id : "invertAllMV"         , type : "button", title : "Invert All M/V"           , icon : "invertAllMV.png"         , functionCall : () => {invertAllMV()}},
            {id : "invertMV"            , type : "button", title : "Invert M/V"               , icon : "invertMV.png"            , functionCall : () => {changeSketchMode(event)}}

        ];
        const gridButton = [
            {id : "decrease-grid", type : "button", title : "Decrease Grid Size", icon : "decreaseGrid.png", functionCall : () => {changeGrid(0)}},
            {id : "increase-grid", type : "button", title : "Increase Grid Size", icon : "increaseGrid.png", functionCall : () => {changeGrid(1)}},
            {id : "input-grid"   , type : "input" , title : "User Grid Size"                               , functionCall : () => {setGrid(event)}},
            {id : "set-grid"     , type : "button", title : "Set Grid Size", text : "S"                    , functionCall : () => {setGrid(event)}}
        ];
        const vertexSnapConstant = 0.10;
        const zoomConstant = 0.95;
        const svgHeight = 600;
        const svgWidth = 600;
        const buttonRowCount = 4;
        const buttonWidth = 60;
        const buttonHeight = 40;
        const gridButtonWidth = buttonHeight;
        const buttonPanel = document.getElementById("buttonPanel");
        //add: export .fold, delete

        window.onkeydown = (event) => {
            updatePressedKey(event);
        }
        window.onkeyup = (event) => {
            updateReleasedKey(event);
        }
        
        const resetViewbox = () => {
            SVGHeight = 10000;
            svgViewbox = {x1 : 0, y1 : 0, x2 : SVGHeight, y2 : SVGHeight};
            svg.setAttribute("viewBox", `${svgViewbox.x1} ${svgViewbox.y1} ${svgViewbox.x2} ${svgViewbox.y2}`);
        }
        
        const updatePressedKey = (event) => {
            if (pressedKey === "") {
                pressedKey = event.code;
                
            } else if (pressedKey === "ShiftLeft" || pressedKey === "ShiftRight") {
                let viewboxXShift = 0;
                let viewboxYShift = 0;
                switch (event.code) {
                    case "ArrowLeft":
                        viewboxXShift = -0.02 * SVGHeight;
                        break;
                    case "ArrowRight":
                        viewboxXShift = 0.02 * SVGHeight;
                        break;
                    case "ArrowUp":
                        viewboxYShift = -0.02 * SVGHeight;
                        break;
                    case "ArrowDown":
                        viewboxYShift = 0.02 * SVGHeight;
                        break;
                }
                svgViewbox.x1 += viewboxXShift;
                svgViewbox.y1 += viewboxYShift;
                svg.setAttribute("viewBox", `${svgViewbox.x1} ${svgViewbox.y1} ${svgViewbox.x2} ${svgViewbox.y2}`);
            } else if (pressedKey === "ControlLeft" || pressedKey === "ControlRight") {
                switch (event.code) {
                    case "ArrowUp":
                        svgViewbox.x1 -= ((1 - zoomConstant) / zoomConstant) * SVGHeight / 2;
                        svgViewbox.y1 -= ((1 - zoomConstant) / zoomConstant) * SVGHeight / 2;
                        SVGHeight /= zoomConstant;
                        break;
                    case "ArrowDown":
                        svgViewbox.x1 += (1 - zoomConstant) * SVGHeight / 2;
                        svgViewbox.y1 += (1 - zoomConstant) * SVGHeight / 2;
                        SVGHeight *= zoomConstant;
                        break;
                }
                
                svgViewbox.x2 = SVGHeight;
                svgViewbox.y2 = SVGHeight;
            }
            svg.setAttribute("viewBox", `${svgViewbox.x1} ${svgViewbox.y1} ${svgViewbox.x2} ${svgViewbox.y2}`);
        }
        const updateReleasedKey = (event) => {
            if (event.code === pressedKey) {
                pressedKey = "";
            } else {
                return;
            }
        }

        const createGridButtonLayout = () => {
            for (let i = 0; i < gridButton.length; i++) {
                createButton(gridButton, i, "gridButton")
            }
            buttonOffset += buttonHeight
        }
        const createLineWidthLayout = () => {
            for (let i = 0; i < lineWidthButton.length; i++) {
                createButton(lineWidthButton, i, "lineWidthButton")
            }
            buttonOffset += buttonHeight
        }

        const changeLineWidth = (val) => {
            if (val) {
                lineWidthFactor += lineWidthFactorIncrement;
            } else {
                if (lineWidthFactor === 0.00002) {
                    return;
                } else {
                lineWidthFactor -= lineWidthFactorIncrement;
                }
            }
            svg.style.setProperty("--line-width", (lineWidthFactor * SVGHeight) + "px");
        }

        const createLine = (x1, y1, x2, y2, className) => {
            const newLine = document.createElementNS("http://www.w3.org/2000/svg", "line");
            newLine.setAttribute("x1", x1);
            newLine.setAttribute("x2", x2);
            newLine.setAttribute("y1", y1);
            newLine.setAttribute("y2", y2);
            newLine.classList.add(className);
            newLine.setAttribute("stroke-width", "var(--line-width)");
            if (className === "grid-line" || className === "highlight-line") {
                svg.insertBefore(newLine, svg.firstChild);
            } else {
                svg.appendChild(newLine);
            }
            return newLine;
        }

        const createGridLines = () => {
            const gridLines = document.querySelectorAll(".grid-line");
            for (const line of gridLines) {
                line.remove();
            }
            for (let col = 1; col < gridSize; col++) {
                let x1 = (col / gridSize) * 10000;
                let x2 = (col / gridSize) * 10000;
                let y1 = 0;
                let y2 = 10000;
                createLine(x1, y1, x2, y2, "grid-line"); 
            }
            for (let row = 1; row < gridSize; row++) {
                let x1 = 0;
                let x2 = 10000;
                let y1 = (row / gridSize) * 10000;
                let y2 = (row / gridSize) * 10000;
                createLine(x1, y1, x2, y2, "grid-line");
            }
        }

        const changeLineType = (event) => {
            lineType = event.target.id;
        }
        const removeSelectedLines = () => {
            for (const line of svg.querySelectorAll(".highlight-line")) {
                line.remove();
            }
            selectedLines = [];
        }
        const changeSketchMode = (event) => {
            sketchMode = event.target.id;
            if (sketchMode !== "selectLines" && sketchMode !== "selectAll" && sketchMode !== "unselectLines") {
                removeSelectedLines();
            }
            if (sketchMode === "selectAll") {
                selectAllLines();
            }
        }
        const setGrid = (event) => {
            let gridInput = Number(document.querySelector("#input-grid").value);
            if (
                ((event.key == "Enter") && (event.target.tagName === "INPUT")) ||
                ((event.button == 0)    && (event.target.tagName === "BUTTON"))
            ) {
                if (Number.isInteger(gridInput)) {
                    gridSize = gridInput;
                    createGridLines();
                }

            }
            
        }

        const changeGrid = (val) => {
            if (val) {
                gridSize *= 2;
            } else {
                if (gridSize == 1)  {
                    return;
                } else {
                    gridSize = Math.ceil(gridSize / 2);
                }
            }
            createGridLines();
            document.querySelector("#input-grid").value = gridSize;
        }

        const createSVG = () => {
            const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svg.setAttribute('style', 'border: 1px solid black');
            svg.setAttribute('width', svgWidth);
            svg.setAttribute('height', svgHeight);
            svg.setAttribute("viewBox", `${svgViewbox.x1} ${svgViewbox.y1} ${svgViewbox.x2} ${svgViewbox.y2}`);
            svg.style.position = "absolute";
            svg.style.top = svgOffset + "px";
            svg.style.left = buttonWidth * buttonRowCount + 20 + "px"
            svg.style.backgroundColor = "white";
            svg.id = "crease-display";
            document.body.appendChild(svg);
            
            svg.onmousemove = (event) => {
                coordText.textContent = [Math.trunc(getSvgCoord(event)[0]),Math.trunc(getSvgCoord(event)[1])];
                mouseMoveEvent(event);
            }
            svg.onmousedown = (event) => {
                mouseDownEvent(event);
            }
            svg.onmouseup = (event) => {
                mouseMode = "up";
                mouseUpEvent(event);
            }
            svg.oncontextmenu = (event) => {
                event.preventDefault();
            }
            svg.onwheel = (event) => {
                event.preventDefault();
                mouseScrollEvent(event);
            }
            
        }

        const mouseScrollEvent = (event) => {
            let viewBoxOffsetX = (getSvgCoord(event)[0] - svgViewbox.x1)/(svgViewbox.x2);
            let viewBoxOffsetY = (getSvgCoord(event)[1] - svgViewbox.y1)/(svgViewbox.y2);

            if (event.deltaY > 0) {
                SVGHeight /= zoomConstant;
            } else {
                SVGHeight *= zoomConstant;
            }
            svgViewbox.x1 = (getSvgCoord(event)[0] - (SVGHeight * viewBoxOffsetX));
            svgViewbox.y1 = (getSvgCoord(event)[1] - (SVGHeight * viewBoxOffsetY));
            svgViewbox.x2 = SVGHeight;
            svgViewbox.y2 = SVGHeight;
            svg.setAttribute("viewBox", `${svgViewbox.x1} ${svgViewbox.y1} ${svgViewbox.x2} ${svgViewbox.y2}`);
            svg.style.setProperty("--line-width", (lineWidthFactor * SVGHeight) + "px");
        }
        
        let userFile;
        const reader = new FileReader();
        reader.onload = (event) => {
            userFile = JSON.parse(event.target.result);
            fileDisplay();
        }

        const fileDisplay = () => {
            removeSelectedLines();
            let vertices_coords = userFile.vertices_coords;
            edges_vertices = userFile.edges_vertices;
            edges_assignment = userFile.edges_assignment;

            //find largest vertex coordinate (typically the bottomright corner of the square crease pattern)
            let maxCoord = 0;
            for (let i = 0; i < userFile.vertices_coords.length; i++) {
                if (Math.max(vertices_coords[i][0], vertices_coords[i][1]) > maxCoord) {
                    maxCoord = Math.max(vertices_coords[i][0], vertices_coords[i][1])
                }   
            }

            //factor to scale vertex coordinates to default SVG height/ width (10000 units)
            let scalingFactor = 10000 / maxCoord;
            vertices = []; 
            for (let i = 0; i < vertices_coords.length; i++) {
                vertices.push([vertices_coords[i][0] * scalingFactor, vertices_coords[i][1] * scalingFactor])
            }
            for (const line of document.querySelectorAll(".edge-line, .mountain-line, .valley-line")) {
                line.remove();
            }
            
            for (let i = 0; i < edges_vertices.length; i++) {
                let lineClass;
                switch(edges_assignment[i]) {
                    case ("B"):
                        lineClass = "edge-line";
                        break;
                    case ("M"):
                        lineClass = "mountain-line";
                        break;
                    case ("V"):
                        lineClass = "valley-line";
                        break;
                }
                let x1 = vertices[edges_vertices[i][0]][0];
                let y1 = vertices[edges_vertices[i][0]][1];
                let x2 = vertices[edges_vertices[i][1]][0];
                let y2 = vertices[edges_vertices[i][1]][1];
                createLine(x1, y1, x2, y2, lineClass);
            }
            displayEdges();
            displayVertices();
        }

        const fileUpload = (event) => {
            const rawFile = event.target.files;
            const extension = rawFile[0].name.split('.').pop().toLowerCase();
            if (extension !== "fold") {
                document.getElementById("uploadFileName").innerHTML = "Invalid File Type!";
            } else {
                document.getElementById("uploadFileName").innerHTML = rawFile[0].name;
                reader.readAsText(rawFile[0]);
            }
            
        }

        //startVertex1, endVertex1 correspond to start and end vertex of drawn line
        //startVertex2, endVertex2 correspond to start and end vertex of existing line (that is in edges_vertices)
        const determineLineOverlap = (startVertex1, endVertex1, startVertex2, endVertex2) => {
            if (Math.min(startVertex1[0], endVertex1[0]) === Math.min(startVertex2[0],endVertex2[0]) && 
                Math.max(startVertex1[0], endVertex1[0]) === Math.max(startVertex2[0],endVertex2[0]) &&
                Math.min(startVertex1[1], endVertex1[1]) === Math.min(startVertex2[1],endVertex2[1]) &&
                Math.max(startVertex1[1], endVertex1[1]) === Math.max(startVertex2[1],endVertex2[1])) {
                    return "Complete Overlap";
            }
            
            let dirVector1 = sub(endVertex1, startVertex1);
            let dirVector2 = sub(endVertex2, startVertex2);
            if (isParallel2(startVertex1, endVertex1, startVertex2, endVertex2)) { //Parallel lines check
                if (Math.abs(cross2D(sub(startVertex1, startVertex2), dirVector1)) < epsilon) { //Colinearity check
                    if ((Math.min(startVertex1[0], endVertex1[0]) <= startVertex2[0] && startVertex2[0] <= Math.max(startVertex1[0], endVertex1[0])) && 
                        (Math.min(startVertex1[0], endVertex1[0]) <= endVertex2[0] && endVertex2[0] <= Math.max(startVertex1[0], endVertex1[0]))) {
                            return "Drawn Line Fully Overlapping Colinear"

                    } else if ((Math.min(startVertex2[0], endVertex2[0]) <= startVertex1[0] && startVertex1[0] <= Math.max(startVertex2[0], endVertex2[0])) && 
                        (Math.min(startVertex2[0], endVertex2[0]) <= endVertex1[0] && endVertex1[0] <= Math.max(startVertex2[0], endVertex2[0]))) {
                            return "Existing Line Fully Overlapping Colinear"

                    } else if ((Math.min(startVertex1[0], endVertex1[0]) < startVertex2[0] && startVertex2[0] < Math.max(startVertex1[0], endVertex1[0])) || 
                        (Math.min(startVertex1[0], endVertex1[0]) < endVertex2[0] && endVertex2[0] < Math.max(startVertex1[0], endVertex1[0]))) {

                            return "Partially Overlapping Colinear"
                    } else {
                        return "Non Overlapping Colinear"                    
                    }

                } else {
                    return "Distinct Parallel"
                }
            } else {
                let intersectionVertex = findAnyIntersection(startVertex1, dirVector1, startVertex2, dirVector2);
                if ((Math.min(startVertex1[0], endVertex1[0]) <= intersectionVertex[0] && intersectionVertex[0] <= Math.max(startVertex1[0], endVertex1[0])) && //checks if intersection vertex lies on existing line and drawn line
                    (Math.min(startVertex1[1], endVertex1[1]) <= intersectionVertex[1] && intersectionVertex[1] <= Math.max(startVertex1[1], endVertex1[1])) && //if yes, then continue to classify the intersection
                    (Math.min(startVertex2[0], endVertex2[0]) <= intersectionVertex[0] && intersectionVertex[0] <= Math.max(startVertex2[0], endVertex2[0])) &&
                    (Math.min(startVertex2[1], endVertex2[1]) <= intersectionVertex[1] && intersectionVertex[1] <= Math.max(startVertex2[1], endVertex2[1]))) {
                         if (((intersectionVertex[0] === startVertex1[0] && intersectionVertex[1] === startVertex1[1]) ||       //checks if intersection vertex is EITHER start OR end vertex of drawn line
                            (intersectionVertex[0] === endVertex1[0] && intersectionVertex[1] === endVertex1[1])) &&            //AND
                           (!(intersectionVertex[0] === startVertex2[0] && intersectionVertex[1] === startVertex2[1]) &&        //checks if intersection vertex is NEITHER start NOR end vertex of existing line
                            !(intersectionVertex[0] === endVertex2[0] && intersectionVertex[1] === endVertex2[1]))) {           
                            return "Drawn Line Start/End Vertex Intersection";

                        } else if (((intersectionVertex[0] === startVertex2[0] && intersectionVertex[1] === startVertex2[1]) || //checks if intersection vertex is EITHER start OR end vertex of existing line
                                    (intersectionVertex[0] === endVertex2[0] && intersectionVertex[1] === endVertex2[1])) &&    //AND
                                (!(intersectionVertex[0] === startVertex1[0] && intersectionVertex[1] === startVertex1[1]) &&   //checks if intersection vertex is NEITHER start NOR end vertex of drawn line
                                !(intersectionVertex[0] === endVertex1[0] && intersectionVertex[1] === endVertex1[1]))) {       
                            return "Existing Line Start/End Vertex Intersection";
                                
                        } else if (((intersectionVertex[0] === startVertex1[0] && intersectionVertex[1] === startVertex1[1]) || //checks if intersection vertex is EITHER start OR end vertex of drawn line
                                    (intersectionVertex[0] === endVertex1[0] && intersectionVertex[1] === endVertex1[1])) &&    //AND
                                ((intersectionVertex[0] === startVertex2[0] && intersectionVertex[1] === startVertex2[1]) ||    //checks if intersection vertex is EITHER start OR end vertex of existing line
                                (intersectionVertex[0] === endVertex2[0] && intersectionVertex[1] === endVertex2[1]))) {        
                            return "Both Start/End Vertex Intersection"
                        } else {
                            return "Intersecting Skew";
                        } 
                } else {
                    return "Non Intersecting Skew"
                } 
            }
        }

        const drawEditableLine = (startVertex, endVertex) => {
            let drawNewLine = true;
            let dirVector1;
            let dirVector2;
            let oldStartVertex;
            let oldEndVertex;
            let oldEndVertexId;
            let intersectionVertex;
            let intersectionVertexId;
            //for clicks/ edges_vertices too small to draw, return
            if (startVertex[1] === endVertex[1] && startVertex[0] === endVertex[0]) {
                debugArr(vertices, edges_vertices, edges_assignment)
                return;
            }
            let startVertexId = vertices.findIndex(vertex => vertex[0] === startVertex[0] && vertex[1] === startVertex[1])
            if (startVertexId === -1) {
                vertices.push(startVertex);
                vertices_edges.push([]);
                startVertexId = vertices.length - 1;
            }

            let endVertexId = vertices.findIndex(vertex => vertex[0] === endVertex[0] && vertex[1] === endVertex[1])
            if (endVertexId === -1) {
                vertices.push(endVertex);
                vertices_edges.push([]);
                endVertexId = vertices.length - 1;
            }

            let newLineIntersections = [startVertex, endVertex];

            let edges_vertices_length = edges_vertices.length;

            for (let i = 0; i < edges_vertices_length; i++) {
                let lines = document.querySelectorAll(".edge-line, .mountain-line, .valley-line");
                switch (determineLineOverlap(startVertex, endVertex, vertices[edges_vertices[i][0]], vertices[edges_vertices[i][1]])) {
                    case "Complete Overlap":
                        let recentEdgeId = Math.max(
                        edges_vertices.findIndex(line => (line[0] === endVertexId && line[1] === startVertexId)),
                        edges_vertices.findIndex(line => (line[0] === startVertexId && line[1] === endVertexId)));
                        
                        lines[recentEdgeId].removeAttribute("class");
                        lines[recentEdgeId].classList.add(lineType + "-line")
                        switch (lineType) {
                            case "mountain":
                                edges_assignment[recentEdgeId] = "M";
                                break;
                            case "valley":
                                edges_assignment[recentEdgeId] = "V";
                                break;
                            case "auxiliary":
                                edges_assignment[recentEdgeId] = "A";
                                break;
                            case "edge":
                                edges_assignment[recentEdgeId] = "B";
                        }
                        drawNewLine = false;
                        console.log("Complete Overlap")
                        break;

                    case "Drawn Line Fully Overlapping Colinear":
                        oldStartVertex = vertices[edges_vertices[i][0]];
                        oldEndVertex = vertices[edges_vertices[i][1]];
                        if (newLineIntersections.findIndex(vertex => vertex[0] === oldStartVertex[0] && vertex[1] === oldStartVertex[1]) === -1) {
                            newLineIntersections.push(oldStartVertex);
                        }
                        if (newLineIntersections.findIndex(vertex => vertex[0] === oldEndVertex[0] && vertex[1] === oldEndVertex[1]) === -1) {
                            newLineIntersections.push(oldEndVertex);
                        }
                        lines[i].removeAttribute("class");
                        lines[i].classList.add(lineType + "-line")
                        switch (lineType) {
                            case "mountain":
                                edges_assignment[i] = "M";
                                break;
                            case "valley":
                                edges_assignment[i] = "V";
                                break;
                            case "auxiliary":
                                edges_assignment[i] = "A";
                                break;
                            case "edge":
                                edges_assignment[i] = "B";
                        }
                        //console.log("Drawn Line Fully Overlapping Colinear");
                        break;

                    case "Existing Line Fully Overlapping Colinear":
                    
                        if (vertices[edges_vertices[i][0]][0] === startVertex[0]) {
                            lines[i].setAttribute("x1", endVertex[0]);
                            lines[i].setAttribute("y1", endVertex[1]);
                            vertices_edges[edges_vertices[i][0]].splice(vertices_edges[edges_vertices[i][0]].findIndex(edgeId => edgeId === i));
                            vertices_edges[endVertexId].push(i)
                            edges_vertices[i][0] = endVertexId;

                        } else if (vertices[edges_vertices[i][1]][0] === startVertex[0]) {
                            lines[i].setAttribute("x2", endVertex[0]);
                            lines[i].setAttribute("y2", endVertex[1]);
                            vertices_edges[edges_vertices[i][1]].splice(vertices_edges[edges_vertices[i][1]].findIndex(edgeId => edgeId === i));
                            vertices_edges[endVertexId].push(i)
                            edges_vertices[i][1] = endVertexId;
                        } else if (vertices[edges_vertices[i][0]][0] === endVertex[0]) {
                            lines[i].setAttribute("x1", startVertex[0]);
                            lines[i].setAttribute("y1", startVertex[1]);
                            vertices_edges[edges_vertices[i][0]].splice(vertices_edges[edges_vertices[i][0]].findIndex(edgeId => edgeId === i));
                            vertices_edges[startVertexId].push(i)
                            edges_vertices[i][0] = startVertexId;
                        } else if (vertices[edges_vertices[i][1]][0] === endVertex[0]) {
                            lines[i].setAttribute("x2", startVertex[0]);
                            lines[i].setAttribute("y2", startVertex[1]);
                            vertices_edges[edges_vertices[i][1]].splice(vertices_edges[edges_vertices[i][1]].findIndex(edgeId => edgeId === i));
                            vertices_edges[endVertexId].push(i)
                            edges_vertices[i][1] = startVertexId;
                        } else {
                            oldEndVertex = vertices[edges_vertices[i][1]];
                            oldEndVertexId = edges_vertices[i][1];
                            if (getAbsDist(vertices[edges_vertices[i][0]][0], vertices[edges_vertices[i][0]][1], startVertex[0], startVertex[1]) <
                                getAbsDist(vertices[edges_vertices[i][0]][0], vertices[edges_vertices[i][0]][1], endVertex[0], endVertex[1])) {

                                lines[i].setAttribute("x2", startVertex[0]);
                                lines[i].setAttribute("y2", startVertex[1]);
                                vertices_edges[edges_vertices[i][1]].splice(vertices_edges[edges_vertices[i][1]].findIndex(edgeId => edgeId === i));
                                vertices_edges[startVertexId].push(i)
                                edges_vertices[i][1] = startVertexId;
                                

                                createLine(endVertex[0], endVertex[1], oldEndVertex[0], oldEndVertex[1], lines[i].getAttribute("class"));
                                vertices_edges[endVertexId].push(edges_vertices.length - 1);
                                vertices_edges[oldEndVertexId].push(edges_vertices.length - 1);
                                edges_vertices.push([endVertexId, oldEndVertexId]);
                                edges_assignment.push(edges_assignment[i]);

                            
                            } else {
                                lines[i].setAttribute("x2", endVertex[0]);
                                lines[i].setAttribute("y2", endVertex[1]);
                                vertices_edges[edges_vertices[i][1]].splice(vertices_edges[edges_vertices[i][1]].findIndex(edgeId => edgeId === i));
                                vertices_edges[endVertexId].push(i)
                                edges_vertices[i][1] = endVertexId;
                                    
                                createLine(startVertex[0], startVertex[1], oldEndVertex[0], oldEndVertex[1], lines[i].getAttribute("class"));
                                vertices_edges[startVertexId].push(edges_vertices.length - 1);
                                vertices_edges[oldEndVertexId].push(edges_vertices.length - 1);
                                edges_vertices.push([startVertexId, oldEndVertexId]);
                                edges_assignment.push(edges_assignment[i]);
                            
                            }
                        }
                        //console.log("Existing Line Fully Overlapping Colinear");
                        break;

                    case "Partially Overlapping Colinear":
                        if ((Math.min(vertices[edges_vertices[i][0]][0], vertices[edges_vertices[i][1]][0]) < startVertex[0] && startVertex[0] < Math.max(vertices[edges_vertices[i][0]][0], vertices[edges_vertices[i][1]][0]))) {
                            if (Math.min(startVertex[0], endVertex[0]) < vertices[edges_vertices[i][0]][0] && vertices[edges_vertices[i][0]][0] < Math.max(startVertex[0], endVertex[0])) {
                                if (newLineIntersections.findIndex(vertex => vertex[0] === vertices[edges_vertices[i][0]][0] && vertex[1] === vertices[edges_vertices[i][0]][1]) === -1) {
                                    newLineIntersections.push(vertices[edges_vertices[i][0]]);
                                }
                                lines[i].setAttribute("x1", startVertex[0]);
                                lines[i].setAttribute("y1", startVertex[1]);
                                vertices_edges[edges_vertices[i][0]].splice(vertices_edges[edges_vertices[i][0]].findIndex(edgeId => edgeId === i));
                                vertices_edges[startVertexId].push(i)
                                edges_vertices[i][0] = startVertexId;

                            } else {
                                if (newLineIntersections.findIndex(vertex => vertex[0] === vertices[edges_vertices[i][1]][0] && vertex[1] === vertices[edges_vertices[i][1]][1]) === -1) {
                                    newLineIntersections.push(vertices[edges_vertices[i][1]]);
                                }
                                lines[i].setAttribute("x2", startVertex[0]);
                                lines[i].setAttribute("y2", startVertex[1]);
                                vertices_edges[edges_vertices[i][1]].splice(vertices_edges[edges_vertices[i][1]].findIndex(edgeId => edgeId === i));
                                vertices_edges[startVertexId].push(i)
                                edges_vertices[i][1] = startVertexId;

                            }
                        } else {
                            if (Math.min(startVertex[0], endVertex[0]) < vertices[edges_vertices[i][0]][0] && vertices[edges_vertices[i][0]][0] < Math.max(startVertex[0], endVertex[0])) {
                                if (newLineIntersections.findIndex(vertex => vertex[0] === vertices[edges_vertices[i][0]][0] && vertex[1] === vertices[edges_vertices[i][0]][1]) === -1) {
                                    newLineIntersections.push(vertices[edges_vertices[i][0]]);
                                }
                                lines[i].setAttribute("x1", endVertex[0]);
                                lines[i].setAttribute("y1", endVertex[1]);
                                edges_vertices[i][0] = endVertexId;

                            } else {
                                if (newLineIntersections.findIndex(vertex => vertex[0] === vertices[edges_vertices[i][1]][0] && vertex[1] === vertices[edges_vertices[i][1]][1]) === -1) {
                                    newLineIntersections.push(vertices[edges_vertices[i][1]]);
                                }
                                lines[i].setAttribute("x2", endVertex[0]);
                                lines[i].setAttribute("y2", endVertex[1]);
                                edges_vertices[i][1] = endVertexId;
                            }
                        }
                        console.log("Partially Overlapping Colinear");
                        break;

                    case "Non Overlapping Colinear":
                        //console.log("Non Overlapping Colinear");
                        //no intersection required
                        break;

                    case "Distinct Parallel":
                        //console.log("Distinct Parallel")
                        //no intersection required
                        break;

                    case "Drawn Line Start/End Vertex Intersection":
                        dirVector1 = sub(endVertex, startVertex);
                        dirVector2 = sub(vertices[edges_vertices[i][1]], vertices[edges_vertices[i][0]]);
                        oldStartVertex = vertices[edges_vertices[i][0]];
                        oldEndVertex = vertices[edges_vertices[i][1]];
                        oldEndVertexId = edges_vertices[i][1];
                        intersectionVertex = findAnyIntersection(startVertex, dirVector1, vertices[edges_vertices[i][0]], dirVector2);
                        intersectionVertexId = vertices.findIndex(vertex => vertex[0] === intersectionVertex[0] && vertex[1] === intersectionVertex[1]);
                        if (intersectionVertexId === -1) {
                            vertices.push(intersectionVertex);
                            vertices_edges.push([]);
                            intersectionVertexId = vertices.length - 1;
                        }
                        if (intersectionVertex[0] !== oldStartVertex[0] ||
                            intersectionVertex[0] !== oldEndVertex[0] ||
                            intersectionVertex[1] !== oldEndVertex[1] ||
                            intersectionVertex[1] !== oldEndVertex[1]) {
                            lines[i].setAttribute("x2", intersectionVertex[0]);
                            lines[i].setAttribute("y2", intersectionVertex[1]);
                            console.log(vertices_edges[edges_vertices[i][1]])
                            vertices_edges[edges_vertices[i][1]].splice(vertices_edges[edges_vertices[i][1]].findIndex(edgeId => edgeId === i), 1);
                            console.log(vertices_edges[edges_vertices[i][1]])
                            vertices_edges[intersectionVertexId].push(i);
                            edges_vertices[i][1] = intersectionVertexId;

                            createLine(intersectionVertex[0], intersectionVertex[1], oldEndVertex[0], oldEndVertex[1], lines[i].getAttribute("class"));
                            vertices_edges[intersectionVertexId].push(edges_vertices.length);
                            vertices_edges[oldEndVertexId].push(edges_vertices.length);
                            edges_vertices.push([intersectionVertexId, oldEndVertexId]);
                            edges_assignment.push(edges_assignment[i]);
                        }    
                        //console.log("Drawn Line Start/End Vertex Intersection")
                        break;

                    case "Existing Line Start/End Vertex Intersection":
                        dirVector1 = sub(endVertex, startVertex);
                        dirVector2 = sub(vertices[edges_vertices[i][1]], vertices[edges_vertices[i][0]]);
                        intersectionVertex = findAnyIntersection(startVertex, dirVector1, vertices[edges_vertices[i][0]], dirVector2);
                        intersectionVertexId = vertices.findIndex(vertex => vertex[0] === intersectionVertex[0] && vertex[1] === intersectionVertex[1]);
                        
                        if (intersectionVertexId === -1) {
                            vertices.push(intersectionVertex);
                            vertices_edges.push([]);
                            intersectionVertexId = vertices.length - 1;
                        }

                        if (newLineIntersections.findIndex(vertex => vertex[0] === intersectionVertex[0] && vertex[1] === intersectionVertex[1]) === -1) {
                            newLineIntersections.push(intersectionVertex);
                        }

                        break;

                    case "Both Start/End Vertex Intersection":
                        //no intersection required
                        break;

                    case "Intersecting Skew":
                        dirVector1 = sub(endVertex, startVertex);
                        dirVector2 = sub(vertices[edges_vertices[i][1]], vertices[edges_vertices[i][0]]);
                        oldStartVertex = vertices[edges_vertices[i][0]];
                        oldEndVertex = vertices[edges_vertices[i][1]];
                        oldEndVertexId = edges_vertices[i][1];
                        intersectionVertex = findAnyIntersection(startVertex, dirVector1, vertices[edges_vertices[i][0]], dirVector2);
                        intersectionVertexId = vertices.findIndex(vertex => vertex[0] === intersectionVertex[0] && vertex[1] === intersectionVertex[1]);

                        if (intersectionVertexId === -1) {
                            vertices.push(intersectionVertex);
                            vertices_edges.push([]);
                            intersectionVertexId = vertices.length - 1;
                        }

                        if (newLineIntersections.findIndex(vertex => vertex[0] === intersectionVertex[0] && vertex[1] === intersectionVertex[1]) === -1) {
                            newLineIntersections.push(intersectionVertex);
                        }

                        //shortens endpoint of existing line to intersection point, draws new line from intersection to original endpoint of existing line
                        if (intersectionVertex[0] !== oldStartVertex[0] ||
                            intersectionVertex[0] !== oldEndVertex[0] ||
                            intersectionVertex[1] !== oldEndVertex[1] ||
                            intersectionVertex[1] !== oldEndVertex[1]) {
                            lines[i].setAttribute("x2", intersectionVertex[0]);
                            lines[i].setAttribute("y2", intersectionVertex[1]);
                            vertices_edges[edges_vertices[i][1]].splice(vertices_edges[edges_vertices[i][1]].findIndex(edgeId => edgeId === i), 1);
                            vertices_edges[intersectionVertexId].push(i);
                            edges_vertices[i][1] = intersectionVertexId;

                            createLine(intersectionVertex[0], intersectionVertex[1], oldEndVertex[0], oldEndVertex[1], lines[i].getAttribute("class"));
                            vertices_edges[intersectionVertexId].push(edges_vertices.length);
                            vertices_edges[oldEndVertexId].push(edges_vertices.length);
                            edges_vertices.push([intersectionVertexId, oldEndVertexId]);
                            edges_assignment.push(edges_assignment[i]);
                        }
                        break;
                    
                    case "Non Intersecting Skew":
                        //no intersection required
                        break;


                }
            }

            //sorts vertices along drawn line, depending on whether line is drawn right-to-left or left-to-right
            if (startVertex[0] < endVertex[0]) {
                newLineIntersections.sort((a, b) => (a[0] - b[0]));
            } else if (startVertex[0] > endVertex[0]) {
                newLineIntersections.sort((a, b) => (b[0] - a[0]));
            } else {
                if (startVertex[1] < endVertex[1]) {
                    newLineIntersections.sort((a, b) => (a[1] - b[1]));
                } else {
                    newLineIntersections.sort((a, b) => (b[1] - a[1]));
                }
            }

            //draws new line, checking if existing line exists in the case of overlapping lines
            if (drawNewLine === true) {
                for (let i = 0; i < newLineIntersections.length - 1; i++) {
                    let newStartVertex = newLineIntersections[i];
                    let newStartVertexId = vertices.findIndex(vertex => vertex[0] === newStartVertex[0] && vertex[1] === newStartVertex[1]);
                    let newEndVertex = newLineIntersections[i + 1];
                    let newEndVertexId = vertices.findIndex(vertex => vertex[0] === newEndVertex[0] && vertex[1] === newEndVertex[1]);
                    let newEdgeId = Math.max(
                        edges_vertices.findIndex(line => (line[0] === newEndVertexId && line[1] === newStartVertexId)),
                        edges_vertices.findIndex(line => (line[0] === newStartVertexId && line[1] === newEndVertexId)));
                    if (newEdgeId === -1) {
                        createLine(newStartVertex[0], newStartVertex[1], newEndVertex[0], newEndVertex[1], lineType + "-line");
                        edges_vertices.push([newStartVertexId, newEndVertexId]);
                        vertices_edges[newStartVertexId].push(edges_vertices.length - 1);
                        vertices_edges[newEndVertexId].push(edges_vertices.length - 1);
                        switch (lineType) {
                            case "mountain":
                                edges_assignment.push("M");
                                break;
                            case "valley":
                                edges_assignment.push("V");
                                break;
                            case "auxiliary":
                                edges_assignment.push("A");
                                break;
                            case "edge":
                                edges_assignment.push("B");
                                break;
                        }
                    }
                    

                }
            }
        }
        
        const mouseUpLine = (event) => {
            let userX = getSvgCoord(event)[0];
            let userY = getSvgCoord(event)[1];
            recentEndVertex = findNearestVertex(userX, userY);
            drawEditableLine(recentStartVertex, recentEndVertex);
        }

        const findAnyIntersection = (point1, dirVector1, point2, dirVector2) => {
            let t = cross2D(sub(point2, point1), dirVector2) / cross2D(dirVector1, dirVector2);
            let r = cross2D(sub(point2, point1), dirVector1) / cross2D(dirVector1, dirVector2);
            return add(point2, mult(dirVector2, r))
        }

        const getUnitVector = (vector) => {
            let absDist = Math.hypot(vector[0], vector[1]);
            return divide(vector, absDist);
        }

        const mouseUpAngleBisector = (event) => {
            recentEndVertex = getSvgCoord(event);
            if (recentStartVertex[0] === recentEndVertex[0] && recentStartVertex[1] === recentEndVertex[1]) {
                if (selectedLines.length < 2) {
                    selectSingleLine(event);
                } else if (isParallel(selectedLines[0], selectedLines[1]) && selectedLines.length === 2) {
                    selectSingleLine(event);
                } else if (isParallel(selectedLines[0], selectedLines[1]) && selectedLines.length === 3) {
                    if (typeof(findNearestEdge(recentStartVertex)) === "object" && findNearestEdge(recentStartVertex) !== null) {
                        let nearestEdgeId = findNearestEdge(recentEndVertex).id;
                        if (!edgeIsInArr(edges_vertices[nearestEdgeId], selectedLines)) {
                            console.log("draw middle line")
                            removeSelectedLines();
                        }
                    }
                } else if (!isParallel(selectedLines[0], selectedLines[1]) && selectedLines.length === 2) {
                    if (typeof(findNearestEdge(recentStartVertex)) === "object" && findNearestEdge(recentStartVertex) !== null) {
                        let nearestEdgeId = findNearestEdge(recentEndVertex).id;
                        if (!edgeIsInArr(edges_vertices[nearestEdgeId], selectedLines)) {
                            
                            let line0Vector = sub(vertices[selectedLines[0][1]], vertices[selectedLines[0][0]]);
                            let line1Vector = sub(vertices[selectedLines[1][1]], vertices[selectedLines[1][0]]);
                            let line3Vector = sub(vertices[edges_vertices[nearestEdgeId][1]], vertices[edges_vertices[nearestEdgeId][0]]);
                            let bisectorStartVertex = findAnyIntersection(vertices[selectedLines[0][0]], line0Vector, vertices[selectedLines[1][0]],line1Vector);

                            if (bisectorStartVertex[0] === vertices[selectedLines[0][1]][0] && bisectorStartVertex[1] === vertices[selectedLines[0][1]][1]) {
                                line0Vector = mult(line0Vector, -1)
                            }
                            if (bisectorStartVertex[0] === vertices[selectedLines[1][1]][0] && bisectorStartVertex[1] === vertices[selectedLines[1][1]][1]) {
                                line1Vector = mult(line1Vector, -1)
                            }
                            let bisectorVector = add(getUnitVector(line0Vector), getUnitVector(line1Vector))
                            let bisectorEndVertex = findAnyIntersection(bisectorStartVertex, bisectorVector, vertices[edges_vertices[nearestEdgeId][0]], line3Vector)

                            drawEditableLine(bisectorStartVertex, bisectorEndVertex);
                            removeSelectedLines();
                        }
                    }
                } else {
                    console.log("last case")
                    console.log(!isParallel(selectedLines[0], selectedLines[1]))
                }
            }
        }

        const flatfoldabilityIcons = [
            {id : "maekawa1M", tag : "polygon", fill : "red"  , strokeWidth : "0", stroke : "none", width : "200"},
            {id : "maekawa1V", tag : "polygon", fill : "blue" , strokeWidth : "0", stroke : "none", width : "200"},
            {id : "maekawa1" , tag : "polygon", fill : "grey" , strokeWidth : "0", stroke : "none", width : "200"},
            {id : "maekawa2M", tag : "polygon", fill : "red"  , strokeWidth : "0", stroke : "none", width : "200"},
            {id : "maekawa2V", tag : "polygon", fill : "blue" , strokeWidth : "0", stroke : "none", width : "200"},
            {id : "maekawa2" , tag : "polygon", fill : "grey" , strokeWidth : "0", stroke : "none", width : "200"},
            {id : "maekawa2Mkawasaki" , tag : "circle" , fill : "red"  , strokeWidth : "0", stroke : "none", radius : "100"},
            {id : "maekawa2Vkawasaki" , tag : "circle" , fill : "blue" , strokeWidth : "0", stroke : "none", radius : "100"},
            {id : "maekawa2kawasaki"  , tag : "circle" , fill : "grey" , strokeWidth : "0", stroke : "none", radius : "100"},
            {id : "kawasaki"          , tag : "circle" , fill : "none" , strokeWidth : "5", stroke : "grey", radius : "100"}

        ]

       

        const createFFIcon = () => {
            const defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");
            for (const icon of flatfoldabilityIcons) {
                const iconFF = document.createElementNS("http://www.w3.org/2000/svg", icon.tag);
                iconFF.setAttribute("id", icon.id);
                iconFF.setAttribute("fill", icon.fill);
                iconFF.setAttribute("stroke-width", icon.strokeWidth);
                iconFF.setAttribute("stroke", icon.stroke)
                if (icon.id === "maekawa2M" || icon.id === "maekawa2V" || icon.id === "maekawa2") {
                    let x1 = -icon.width / 2;
                    let y1 = x1;
                    let x2 = -x1;
                    let y2 = y1;
                    let x3 = -x1;
                    let y3 = -y1;
                    let x4 = x1;
                    let y4 = -y1;
                    iconFF.setAttribute("points", `${x1},${y1} ${x2},${y2} ${x3},${y3} ${x4},${y4}`);
                    
                } else if (icon.id === "maekawa1M" || icon.id === "maekawa1V") {
                    let x1 = 0;
                    let y1 = -icon.width / 2;
                    let x2 = icon.width / 2;
                    let y2 = icon.width / 2;
                    let x3 = -x2;
                    let y3 = y2;
                    iconFF.setAttribute("points", `${x1},${y1} ${x2},${y2} ${x3},${y3}`);
                } else if (icon.tag === "circle") {
                    iconFF.setAttribute("x", 0);
                    iconFF.setAttribute("y", 0);
                    iconFF.setAttribute("r", icon.radius);
                } 
                defs.appendChild(iconFF);
            }      
            svg.appendChild(defs);          
        }

        const getMountainCount = (vertexId) => {
            let count = 0;
            for (edgeId of vertices_edges[vertexId]) {
                if (edges_assignment[edgeId] === "M") {
                    count++;
                }
            }
            return count;
        }

        const getValleyCount = (vertexId) => {
            let count = 0;
            for (edgeId of vertices_edges[vertexId]) {
                if (edges_assignment[edgeId] === "V") {
                    count++;
                }
            }
            return count;
        }

        const getEdgeCount = (vertexId) => {
            let count = 0;
            for (edgeId of vertices_edges[vertexId]) {
                if (edges_assignment[edgeId] === "B") {
                    count++;
                }
            }
            return count;
        }
        
        const checkFF = (vertexId) => {
            let mountainCount;
            let upperIdealMountainCount;
            let lowerIdealMountainCount;
            let valleyCount;
            let upperIdealValleyCount;
            let lowerIdealValleyCount;
            if (getEdgeCount(vertexId) > 0) {
                return;
            } else if ((vertices_edges[vertexId].length - getEdgeCount(vertexId)) % 2 !== 0) { //Fails Maekawa Rule #1
                mountainCount = getMountainCount(vertexId);
                valleyCount = getValleyCount(vertexId);

                let selectedLineY1 = vertices[edges_vertices[i][0]][1];
                let selectedLineX2 = vertices[edges_vertices[i][1]][0];
                let selectedLineY2 = vertices[edges_vertices[i][1]][1];
                        
                if ((((0 < t1 && t1 < 1 && 0 < r1 && r1 < 1) || (0 < t2 && t2 < 1 && 0 < r2 && r2 < 1) || (0 < t3 && t3 < 1 && 0 < r3 && r3 < 1) || (0 < t4 && t4 < 1 && 0 < r4 && r4 < 1))) ||

            let minVertex;
            let minVertexDist;
            if (vertices.length > 0) {
                minVertex = vertices[0];
                minVertexDist = getAbsDist(vertices[0][0], vertices[0][1], userX, userY); 
                for (const vertex of vertices) {
                    let testVertexDist = getAbsDist(vertex[0], vertex[1], userX, userY);
                    if (testVertexDist <= minVertexDist) {
                        minVertex = vertex;
                        minVertexDist = testVertexDist;
                    }
                }
            }
            if ((minVertex) && (minVertexDist < vertexSnapConstant * 10000 / gridSize)) {
                return minVertex;
            } else if (minGridDist < (vertexSnapConstant * 10000 / gridSize)) {
                return [nearestGridX, nearestGridY];
            } else {
                return [userX, userY];
            }
        }


        const getAbsDist = (x1, y1, x2, y2) => {
            return Math.hypot((x1 - x2), (y1 - y2));
