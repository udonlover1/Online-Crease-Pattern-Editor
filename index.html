<!DOCTYPE html>
<html>
    <head>
        <title>Online Crease Pattern Editor</title>
        <style>
            * {
                box-sizing: border-box;
                font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                padding: 0px;
                margin: 2px;
                user-select: none;
            }
            body {
                background-color: lightgrey;
            }
            #topMenu {
                display: grid;
                text-align: center;
                justify-content: left;
            }
            #topMenu > div {
                display: flex;
                align-items: center;
                justify-content: left;
            }
            #uploadFileButton {
                height: 20px;
                width: 100px;
            }
            #resetViewbox {
                height: 20px;
                width: 100px;
            }
            #coordText {
                pointer-events: none;
            }
            #crease-display {
                user-select: none;
            }
            button,input {
                width: var(--button-width);
                height: var(--button-height);
                display: flex;
                justify-content: center;
                align-items: center;
                text-align: center;
                box-shadow: none;
                padding: 0px;
                border: 1px solid black;
                background-color: white;
            }
            input[type="checkbox"] {
                width: 20px;
                height: 20px;
            }
            button.active {
                background-color: rgb(154, 151, 151);
            }
            button:active {
                background-color: rgb(175, 174, 174);
            }
            #mountain.active {
                background-color: red;
                color: white;
            }
            #valley.active {
                background-color: blue;
                color: white;
            }
            #auxiliary.active {
                background-color: rgb(174, 221, 243);
            }
            #edge.active {
                background-color: black;
                color: white;
            }
            .grid-line {
                stroke-width: var(--line-width);
                stroke: grey;
            }
            .preview-line {
                stroke-width: var(--line-width);
                stroke: rgb(206, 51, 185);
            }
            .mountain-line {
                stroke-width: var(--line-width);
                stroke: red;
            }
            .valley-line {
                stroke-width: var(--line-width);
                stroke: blue;
            }
            .auxiliary-line {
                stroke-width: var(--line-width);
                stroke: rgb(174, 221, 243);
            }
            .edge-line {
                stroke-width: var(--line-width);
                stroke: black;
            }
        </style>
    </head>
    <body>
        <div>
            <h2>Online Crease Pattern Editor</h2>   
        </div>
        <div id="topMenu">
            <div>
                <button id="uploadFileButton" onclick="hiddenFileInput.click()">Upload File</button>
                <input id="hiddenFileInput" type="file" style="display: none;" onchange="fileUpload(event)"/>
                <p id="uploadFileName">No File Selected</p>
            </div>
            <div>
                <input id="displayVertices" type="checkbox" onchange="displayVertices()"/>
                <p>Display Vertices</p>
            </div>
            <div>
                <input id="displayEdges" type="checkbox" onchange="displayEdges2()"/>
                <p>Display Edges</p>
            </div>
            <div>
                <button id="resetViewbox" onclick="resetViewbox()">Reset Zoom</button>
            </div>
        </div>
        <div id="buttonPanel">
        </div>
        <div id="debug">
        </div>
    </body>
    <script>
        let buttonOffset = 150;
        let svgOffset = 40;
        let SVGHeight = 10000;
        let gridSize = 2;
        let lineIncrement = 8;
        let lineWidth = 10;
        let sketchMode = "line";
        let lineType = "mountain";
        let mouseMode = "up";
        let vertices = [[0,0],[10000,0],[10000,10000],[0,10000]];
        let edges = [[0,1],[1,2],[2,3],[3,0]];
        let edges_assignment = ["E","E","E","E"];
        let recentStartVertex;
        let recentStartVertexId;
        let recentEndVertex;
        let recentEndVertexId;
        let svgViewbox = {x1 : 0, y1 : 0, x2 : SVGHeight, y2 : SVGHeight}
        let pressedKey = "";
        const lineWidthButton = [
            {id : "decrease-line-width", type : "button", title : "Decrease Line Width", icon : "decreaseWidth.png", functionCall : () => {changeLineWidth(0)}},
            {id : "increase-line-width", type : "button", title : "Increase Line Width", icon : "increaseWidth.png", functionCall : () => {changeLineWidth(1)}},
        ];
        const creaseButton = [
            {id : "mountain" , type : "button", title : "Mountain" , text : "M", functionCall : () => {changeLineType(event)}},
            {id : "valley"   , type : "button", title : "Valley"   , text : "V", functionCall : () => {changeLineType(event)}},
            {id : "auxiliary", type : "button", title : "Auxiliary", text : "A", functionCall : () => {changeLineType(event)}},
            {id : "edge"     , type : "button", title : "Edge"     , text : "E", functionCall : () => {changeLineType(event)}},
        ];
        const toolButton = [
            {id : "line"                , type : "button", title : "Draw Line"                , icon : "drawLine.png"},
            {id : "restrictedLine"      , type : "button", title : "Restricted Line"          , icon : "restrictedLine.png"},
            {id : "rabbitEar"           , type : "button", title : "Rabbit Ear"               , icon : "rabbitEar.png"},
            {id : "flatFoldLine"        , type : "button", title : "Draw Flat Foldable Line"  , icon : "flatFoldableLine.png"},
            {id : "extendLine"          , type : "button", title : "Extend Line"              , icon : "extendLine.png"},
            {id : "perpendicularLine"   , type : "button", title : "Perpendicular Line"       , icon : "perpendicularLine.png"},
            {id : "angleBisector"       , type : "button", title : "Angle Bisector"           , icon : "angleBisector.png"},
            {id : "id4"                 , type : "button", title : "title4"},
            {id : "extendLineSameColour", type : "button", title : "Extend Line (same colour)", icon : "extendLineSameColour.png"},
            {id : "alternatingLines"    , type : "button", title : "Draw Alternating Lines"   , icon : "alternatingLines.png"},
            {id : "reflectOverLine"     , type : "button", title : "Reflect Over Line"        , icon : "reflectOverLine.png"},
            {id : "creaseThroughLayers" , type : "button", title : "Crease Through Layers"    , icon : "creaseThroughLayers.png"},
            {id : "selectLines"         , type : "button", title : "Select Lines"             , icon : "selectLines.png"},
            {id : "selectAll"           , type : "button", title : "Select All"               , icon : "selectAll.png"},
            {id : "unselectLines"       , type : "button", title : "Unselect Lines"           , icon : "unselectLines.png"},
            {id : "deselectAll"         , type : "button", title : "Deselect All"             , icon : "deselectAll.png"}
        ];
        const gridButton = [
            {id : "decrease-grid", type : "button", title : "Decrease Grid Size", icon : "decreaseGrid.png", functionCall : () => {changeGrid(0)}},
            {id : "increase-grid", type : "button", title : "Increase Grid Size", icon : "increaseGrid.png", functionCall : () => {changeGrid(1)}},
            {id : "input-grid"   , type : "input" , title : "User Grid Size"                               , functionCall : () => {setGrid(event)}},
            {id : "set-grid"     , type : "button", title : "Set Grid Size", text : "S"                    , functionCall : () => {setGrid(event)}}
        ];
        const vertexSnapConstant = 0.10;
        const zoomConstant = 0.95;
        const svgHeight = 600;
        const svgWidth = 600;
        const buttonRowCount = 4;
        const buttonWidth = 60;
        const buttonHeight = 40;
        const gridButtonWidth = buttonHeight;
        const buttonPanel = document.getElementById("buttonPanel");
        //add: import/ export .fold, select, delete

        window.onkeydown = (event) => {
            updatePressedKey(event);
        }
        window.onkeyup = (event) => {
            updateReleasedKey(event);
        }
        
        const resetViewbox = () => {
            SVGHeight = 10000;
            svgViewbox = {x1 : 0, y1 : 0, x2 : SVGHeight, y2 : SVGHeight};
            svg.setAttribute("viewBox", `${svgViewbox.x1} ${svgViewbox.y1} ${svgViewbox.x2} ${svgViewbox.y2}`);


        }
        
        const updatePressedKey = (event) => {
            if (pressedKey === "") {
                pressedKey = event.code;
                
            } else if (pressedKey === "ShiftLeft" || pressedKey === "ShiftRight") {
                let viewboxXShift = 0;
                let viewboxYShift = 0;
                switch (event.code) {
                    case "ArrowLeft":
                        viewboxXShift = -0.02 * SVGHeight;
                        break;
                    case "ArrowRight":
                        viewboxXShift = 0.02 * SVGHeight;
                        break;
                    case "ArrowUp":
                        viewboxYShift = -0.02 * SVGHeight;
                        break;
                    case "ArrowDown":
                        viewboxYShift = 0.02 * SVGHeight;
                        break;
                }
                svgViewbox.x1 += viewboxXShift;
                svgViewbox.y1 += viewboxYShift;
                svg.setAttribute("viewBox", `${svgViewbox.x1} ${svgViewbox.y1} ${svgViewbox.x2} ${svgViewbox.y2}`);
            } else if (pressedKey === "ControlLeft" || pressedKey === "ControlRight") {
                switch (event.code) {
                    case "ArrowUp":
                        svgViewbox.x1 -= ((1 - zoomConstant) / zoomConstant) * SVGHeight / 2;
                        svgViewbox.y1 -= ((1 - zoomConstant) / zoomConstant) * SVGHeight / 2;
                        SVGHeight /= zoomConstant;
                        break;
                    case "ArrowDown":
                        svgViewbox.x1 += (1 - zoomConstant) * SVGHeight / 2;
                        svgViewbox.y1 += (1 - zoomConstant) * SVGHeight / 2;
                        SVGHeight *= zoomConstant;
                        break;
                }
                
                svgViewbox.x2 = SVGHeight;
                svgViewbox.y2 = SVGHeight;
            }
            svg.setAttribute("viewBox", `${svgViewbox.x1} ${svgViewbox.y1} ${svgViewbox.x2} ${svgViewbox.y2}`);
        }
        const updateReleasedKey = (event) => {
            if (event.code === pressedKey) {
                pressedKey = "";
            } else {
                return;
            }
        }

        const createGridButtonLayout = () => {
            for (let i = 0; i < gridButton.length; i++) {
                createButton(gridButton, i, "gridButton")
            }
            buttonOffset += buttonHeight
        }
        const createLineWidthLayout = () => {
            for (let i = 0; i < lineWidthButton.length; i++) {
                createButton(lineWidthButton, i, "lineWidthButton")
            }
            buttonOffset += buttonHeight
        }

        const changeLineWidth = (val) => {
            if (val) {
                lineWidth += lineIncrement;
            } else {
                if (lineWidth == 2) {
                    return;
                } else {
                    lineWidth -= lineIncrement;
                }
            }
            svg.style.setProperty("--line-width", lineWidth + "px");
        }

        const createLine = (x1, y1, x2, y2, className) => {
            const newLine = document.createElementNS("http://www.w3.org/2000/svg", "line");
            newLine.setAttribute("x1", x1);
            newLine.setAttribute("x2", x2);
            newLine.setAttribute("y1", y1);
            newLine.setAttribute("y2", y2);
            newLine.classList.add(className);
            newLine.setAttribute("stroke-width", "var(--line-width)");
            svg.appendChild(newLine);
            return newLine;
        }

        const createGridLines = () => {
            const gridLines = document.querySelectorAll(".grid-line");
            for (const line of gridLines) {
                line.remove();
            }
            for (let col = 0; col < gridSize + 1; col++) {
                let x1 = (col / gridSize) * 10000;
                let x2 = (col / gridSize) * 10000;
                let y1 = 0;
                let y2 = 10000;
                createLine(x1, y1, x2, y2, "grid-line"); 
            }
            for (let row = 0; row < gridSize + 1; row++) {
                let x1 = 0;
                let x2 = 10000;
                let y1 = (row / gridSize) * 10000;
                let y2 = (row / gridSize) * 10000;
                createLine(x1, y1, x2, y2, "grid-line");
            }
        }

        const changeLineType = (event) => {
            lineType = event.target.id;
        }
        const setGrid = (event) => {
            let gridInput = Number(document.querySelector("#input-grid").value);
            if (
                ((event.key == "Enter") && (event.target.tagName === "INPUT")) ||
                ((event.button == 0)    && (event.target.tagName === "BUTTON"))
            ) {
                if (Number.isInteger(gridInput)) {
                    gridSize = gridInput;
                    createGridLines();
                }

            }
            
        }
        const changeGrid = (val) => {
            if (val) {
                gridSize *= 2;
            } else {
                if (gridSize == 1)  {
                    return;
                } else {
                    gridSize = Math.ceil(gridSize / 2);
                }
            }
            createGridLines();
            document.querySelector("#input-grid").value = gridSize;
        }

        const createSVG = () => {
            const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svg.setAttribute('style', 'border: 1px solid black');
            svg.setAttribute('width', svgWidth);
            svg.setAttribute('height', svgHeight);
            svg.setAttribute("viewBox", `${svgViewbox.x1} ${svgViewbox.y1} ${svgViewbox.x2} ${svgViewbox.y2}`);
            svg.style.position = "absolute";
            svg.style.top = svgOffset + "px";
            svg.style.left = buttonWidth * buttonRowCount + 20 + "px"
            svg.style.backgroundColor = "white";
            svg.id = "crease-display";
            document.body.appendChild(svg);
            
            svg.onmousemove = (event) => {
                coordText.textContent = [Math.trunc(getSvgCoord(event)[0]),Math.trunc(getSvgCoord(event)[1])];
                mouseMoveEvent(event);
            }
            svg.onmousedown = (event) => {
                mouseDownEvent(event);
            }
            svg.onmouseup = (event) => {
                mouseMode = "up";
                mouseUpEvent(event);
            }
            svg.oncontextmenu = (event) => {
                event.preventDefault();
            }
            svg.onwheel = (event) => {
                event.preventDefault();
                mouseScrollEvent(event);
            }
            
        }

        const mouseScrollEvent = (event) => {
            let viewBoxOffsetX = (getSvgCoord(event)[0] - svgViewbox.x1)/(svgViewbox.x2);
            let viewBoxOffsetY = (getSvgCoord(event)[1] - svgViewbox.y1)/(svgViewbox.y2);

            if (event.deltaY > 0) {
                SVGHeight /= zoomConstant;
            } else {
                SVGHeight *= zoomConstant;
            }
            svgViewbox.x1 = (getSvgCoord(event)[0] - (SVGHeight * viewBoxOffsetX));
            svgViewbox.y1 = (getSvgCoord(event)[1] - (SVGHeight * viewBoxOffsetY));
            svgViewbox.x2 = SVGHeight;
            svgViewbox.y2 = SVGHeight;
            svg.setAttribute("viewBox", `${svgViewbox.x1} ${svgViewbox.y1} ${svgViewbox.x2} ${svgViewbox.y2}`);

        }
        
        let userFile;
        const reader = new FileReader();
        reader.onload = (event) => {
            userFile = JSON.parse(event.target.result);
            fileDisplay();
        }

        const fileDisplay = () => {

            let vertices_coords = userFile.vertices_coords;
            edges = userFile.edges_vertices;
            edges_assignment = userFile.edges_assignment;

            //find largest vertex coordinate (typically the bottomright corner of the square crease pattern)
            let maxCoord = 0;
            for (let i = 0; i < userFile.vertices_coords.length; i++) {
                if (Math.max(vertices_coords[i][0], vertices_coords[i][1]) > maxCoord) {
                    maxCoord = Math.max(vertices_coords[i][0], vertices_coords[i][1])
                }   
            }

            //factor to scale vertex coordinates to default SVG height/ width (10000 units)
            let scalingFactor = 10000 / maxCoord;
            vertices = []; 
            for (let i = 0; i < vertices_coords.length; i++) {
                vertices.push([vertices_coords[i][0] * scalingFactor, vertices_coords[i][1] * scalingFactor])
            }
            for (const line of document.querySelectorAll(".edge-line, .mountain-line, .valley-line")) {
                line.remove();
            }
            
            for (let i = 0; i < edges.length; i++) {
                let lineClass;
                switch(edges_assignment[i]) {
                    case ("B"):
                        lineClass = "edge-line";
                        break;
                    case ("M"):
                        lineClass = "mountain-line";
                        break;
                    case ("V"):
                        lineClass = "valley-line";
                        break;
                }
                let x1 = vertices[edges[i][0]][0];
                let y1 = vertices[edges[i][0]][1];
                let x2 = vertices[edges[i][1]][0];
                let y2 = vertices[edges[i][1]][1];
                createLine(x1, y1, x2, y2, lineClass);
            }
        }

        const fileUpload = (event) => {
            const rawFile = event.target.files;
            const extension = rawFile[0].name.split('.').pop().toLowerCase();
            if (extension !== "fold") {
                document.getElementById("uploadFileName").innerHTML = "Invalid File Type!";
            } else {
                document.getElementById("uploadFileName").innerHTML = rawFile[0].name;
                reader.readAsText(rawFile[0]);
            }
            
        }

        const mouseDownLine = (event) => {
            let userX = getSvgCoord(event)[0];
            let userY = getSvgCoord(event)[1];
            recentStartVertex = findNearestVertex(userX, userY);
            recentStartVertexId = vertices.findIndex(vertex => vertex[0] === recentStartVertex[0] && vertex[1] === recentStartVertex[1])
            if (recentStartVertexId === -1) {
                vertices.push(recentStartVertex);
                recentStartVertexId = vertices.length - 1;
            }
            debugArr(vertices, edges, edges_assignment)
        }
        const mouseUpLine = (event) => {
            let userX = getSvgCoord(event)[0];
            let userY = getSvgCoord(event)[1];
            //to make the below into a standalone function that creates editable lines
            recentEndVertex = findNearestVertex(userX, userY);
            recentEndVertexId = vertices.findIndex(vertex => vertex[0] === recentEndVertex[0] && vertex[1] === recentEndVertex[1])
            if (recentEndVertex[1] === recentStartVertex[1] && recentEndVertex[0] === recentStartVertex[0]) {
                debugArr(vertices, edges, edges_assignment)
                return;
            } else if (recentEndVertexId === -1) {

                vertices.push(recentEndVertex);
                recentEndVertexId = vertices.length - 1;
            }

            //checks if a line with same start and end points already exists, and update crease assignment if it does
            let recentEdgeId = Math.max(
                edges.findIndex(line => (line[0] === recentEndVertexId && line[1] === recentStartVertexId)),
                edges.findIndex(line => (line[0] === recentStartVertexId && line[1] === recentEndVertexId)));
            if (recentEdgeId === -1) {
                createLine(recentStartVertex[0], recentStartVertex[1], recentEndVertex[0], recentEndVertex[1], lineType + "-line");
                edges.push([recentStartVertexId, recentEndVertexId])
                recentEdgeId = edges.length - 1
                switch (lineType) {
                    case "mountain":
                        edges_assignment.push("M");
                        break;
                    case "valley":
                        edges_assignment.push("V");
                        break;
                    case "auxiliary":
                        edges_assignment.push("A");
                        break;
                    case "edge":
                        edges_assignment.push("E");
                        break;
                }
            } else {
                let lines = document.querySelectorAll(".edge-line, .mountain-line, .valley-line");
                lines[recentEdgeId].removeAttribute("class");
                lines[recentEdgeId].classList.add(lineType + "-line")
                switch (lineType) {
                    case "mountain":
                        edges_assignment[recentEdgeId] = "M";
                        break;
                    case "valley":
                        edges_assignment[recentEdgeId] = "V";
                        break;
                    case "auxiliary":
                        edges_assignment[recentEdgeId] = "A";
                        break;
                    case "edge":
                        edges_assignment[recentEdgeId] = "E";
                        break;
                }
            }

            
            const edges_length = edges.length;
            let lines = svg.querySelectorAll(".edge-line, .mountain-line, .valley-line");
            let newLineIntersections = [recentStartVertex, recentEndVertex];
            
            for (let i = 0; i < edges_length; i++) {
                if (i === recentEdgeId) {
                    continue;
                } else if (Array.isArray(findIntersection(edges[recentEdgeId], edges[i]))) {

                    let intersectionVertex = findIntersection(edges[recentEdgeId], edges[i])[0];

                    //adds intersection vertex to array to split drawn line afterwards
                    if (newLineIntersections.findIndex(vertex => vertex[0] === intersectionVertex[0] && vertex[1] === intersectionVertex[1]) === -1) {
                        newLineIntersections.push(intersectionVertex);
                    }

                    //checks if intersectionVertex is already in vertices, otherwise creates a new vertex
                    let intersectionVertexId = vertices.findIndex(vertex => vertex[0] === intersectionVertex[0] && vertex[1] === intersectionVertex[1])
                    if (intersectionVertexId === -1) {
                        vertices.push(intersectionVertex);
                        intersectionVertexId = vertices.length - 1;
                    }
                    let oldVertex = [+lines[i].getAttribute("x2"), +lines[i].getAttribute("y2")]
                    let oldVertexId = edges[i][1];
                    let oldLineType = lines[i].getAttribute("class");
                    let oldLineAssignment = edges_assignment[i]



                    //checks if intersectionVertex is at endpoint of testLine, to avoid creating lines of 0 length
                    if ((oldVertex[0] != intersectionVertex[0]) || (oldVertex[1] != intersectionVertex[1])) {
                        //handles creating new lines for SVG: shortens original line to end at intersection vertex
                        lines[i].setAttribute("x2", intersectionVertex[0]);
                        lines[i].setAttribute("y2", intersectionVertex[1]);
                        //handles creating new lines for SVG: creates new line from intersection vertex to original end vertex
                        createLine(intersectionVertex[0], intersectionVertex[1], oldVertex[0], oldVertex[1], oldLineType);
                            
                        //handles creating new element in edges, edges_assignment
                        edges[i][1] = intersectionVertexId;
                        edges.push([intersectionVertexId, oldVertexId]);
                        edges_assignment.push(oldLineAssignment);
                    }
                    
                }
            }
            if (recentStartVertex[0] < recentEndVertex[0]) {
                newLineIntersections.sort((a, b) => (a[0] - b[0]));
            } else if (recentStartVertex[0] > recentEndVertex[0]) {
                newLineIntersections.sort((a, b) => (b[0] - a[0]));
            } else {
                if (recentStartVertex[1] < recentEndVertex[1]) {
                    newLineIntersections.sort((a, b) => (a[1] - b[1]));
                } else {
                    newLineIntersections.sort((a, b) => (b[1] - a[1]));
                }
            }
            
            if (newLineIntersections.length > 2) {
                lines[recentEdgeId].setAttribute("x2", newLineIntersections[1][0]);
                lines[recentEdgeId].setAttribute("y2", newLineIntersections[1][1]);
                edges[recentEdgeId][1] = vertices.findIndex(vertex => vertex[0] === newLineIntersections[1][0] && vertex[1] === newLineIntersections[1][1])
                for (i = 2; i < newLineIntersections.length; i++) {
                    createLine(newLineIntersections[i - 1][0], newLineIntersections[i - 1][1], newLineIntersections[i][0], newLineIntersections[i][1], lineType + "-line");
                    edges.push([
                        vertices.findIndex(vertex => vertex[0] === newLineIntersections[i - 1][0] && vertex[1] === newLineIntersections[i - 1][1]),
                        vertices.findIndex(vertex => vertex[0] === newLineIntersections[i][0] && vertex[1] === newLineIntersections[i][1])
                    ]);
                    switch (lineType) {
                        case "mountain":
                            edges_assignment.push("M");
                            break;
                        case "valley":
                            edges_assignment.push("V");
                            break;
                        case "auxiliary":
                            edges_assignment.push("A");
                            break;
                        case "edge":
                            edges_assignment.push("E");
                            break;
                    }
                }
            }

        }

        const displayEdges2 = () => {
            svg.querySelectorAll(".edge-text").forEach(text => text.remove());
            let lines = document.querySelectorAll(".edge-line, .mountain-line, .valley-line");
            for (let i = 0; i < lines.length; i++) {
                edgeDisplay = document.createElementNS("http://www.w3.org/2000/svg", "text");
                edgeDisplay.setAttribute("x", `${(+lines[i].getAttribute("x1") + +lines[i].getAttribute("x2")) / 2}`);
                edgeDisplay.setAttribute("y", `${(+lines[i].getAttribute("y1") + +lines[i].getAttribute("y2")) / 2}`);
                edgeDisplay.setAttribute("class", "edge-text")
                //edgeDisplay.textContent = `[${Math.trunc(lines[i].getAttribute("x1"))},${Math.trunc(lines[i].getAttribute("y1"))},${Math.trunc(lines[i].getAttribute("x2"))},${Math.trunc(lines[i].getAttribute("y2"))}]`;
                //edgeDisplay.textContent = `[${i}]`
                edgeDisplay.textContent = `[${edges[i]}]`
                edgeDisplay.setAttribute("font-size", 200);
                edgeDisplay.setAttribute("text-anchor", "middle")
                svg.appendChild(edgeDisplay);
                if (!document.getElementById("displayEdges").checked) {
                    edgeDisplay.setAttribute("display", "none");
                }
            }
        }
        const displayVertices = () => {
            svg.querySelectorAll(".vertex-text").forEach(text => text.remove())
            for (let i = 0; i < vertices.length; i++) {
                vertexDisplay = document.createElementNS("http://www.w3.org/2000/svg", "text");
                vertexDisplay.setAttribute("x", `${vertices[i][0]}`);
                vertexDisplay.setAttribute("y", `${vertices[i][1]}`);
                vertexDisplay.setAttribute("class", "vertex-text")
                vertexDisplay.textContent = `(${Math.trunc(vertices[i][0])}, ${Math.trunc(vertices[i][1])})`;
                //vertexDisplay.textContent = `(${i})`
                vertexDisplay.setAttribute("font-size", 200);
                vertexDisplay.setAttribute("text-anchor", "middle")
                svg.appendChild(vertexDisplay);
                if (!document.getElementById("displayVertices").checked) {
                    vertexDisplay.setAttribute("display", "none");
                }
            }
        }

        const findIntersection = (targetLine, testLine) => {
			let targetDirVector = sub(vertices[targetLine[1]] , vertices[targetLine[0]])
            let testDirVector = sub(vertices[testLine[1]] , vertices[testLine[0]])
            
            let t = cross2D(sub(vertices[testLine[0]] , vertices[targetLine[0]]), testDirVector) / cross2D(targetDirVector, testDirVector);
            let r = cross2D(sub(vertices[testLine[0]] , vertices[targetLine[0]]), targetDirVector) / cross2D(targetDirVector, testDirVector);

            if ((0.000001 < t && t <= 1) && (0.000001 < r && r <= 1)) { //r = 1 case included to check case where drawn line "intersects" endpoint of testLine
                let newVertex = add(vertices[testLine[0]], mult(testDirVector, r))
            	return ([newVertex, t]);
            } else {
                return null;
            }
        }

        const mouseUpEvent = (event) => {
            for (const line of svg.querySelectorAll(".preview-line")) {
                line.remove();
            }
            if (event.button === 0) {
                switch (sketchMode) {
                    case "line":
                        mouseUpLine(event);
                        break;
                }
            } else if (event.button === 2) {
                //wip
            }
            displayEdges2();
            displayVertices();
            debugArr(vertices, edges, edges_assignment);
        }
        const setPreviewLine = (event) => {
            if (svg.querySelectorAll(".preview-line").length === 0) {
                let x1 = recentStartVertex[0];
                let y1 = recentStartVertex[1];
                let x2 = getSvgCoord(event)[0];
                let y2 = getSvgCoord(event)[1];
                createLine(x1, y1, x2, y2, "preview-line");
                let previewLine = svg.querySelector(".preview-line");
                previewLine.classList.add(lineType + "-line")
                } else {
                    let previewLine = svg.querySelector(".preview-line")
                    previewLine.setAttribute("x2", getSvgCoord(event)[0]);
                    previewLine.setAttribute("y2", getSvgCoord(event)[1]);
                }
        }
        const mouseDownEvent = (event) => {
            if (event.button === 0) {
                mouseMode = "leftDown";
                switch (sketchMode) {
                    case "line":
                        mouseDownLine(event);
                        break;  
                }
            } else if (event.button === 2) {
                mouseMode = "rightDown";
                recentStartVertex = getSvgCoord(event);
                return;
            } else if (event.button === 1) {
                mouseMode = "middleDown";
                recentStartVertex = getSvgCoord(event);
                mouseMoveEvent(event);
            }
        }
        const mouseMoveEvent = (event) => {
            if (mouseMode === "leftDown") {
                switch (sketchMode) {
                    case ("line"):
                        setPreviewLine(event);
                        break;
                }
            } else if (mouseMode === "rightDown") {
                if (svg.querySelectorAll(".preview-line").length === 0) {
                    createLine(recentStartVertex[0], recentStartVertex[1], getSvgCoord(event)[0], recentStartVertex[1], "preview-line")
                    createLine(getSvgCoord(event)[0], recentStartVertex[1], getSvgCoord(event)[0], getSvgCoord(event)[1], "preview-line")
                    createLine(getSvgCoord(event)[0], getSvgCoord(event)[1], recentStartVertex[0], getSvgCoord(event)[1], "preview-line")
                    createLine(recentStartVertex[0], getSvgCoord(event)[1], recentStartVertex[0], recentStartVertex[1], "preview-line")
                } else {
                    let previewLineList = svg.querySelectorAll(".preview-line")
                    previewLineList[0].setAttribute("x2", getSvgCoord(event)[0]);
                    previewLineList[1].setAttribute("x1", getSvgCoord(event)[0]);
                    previewLineList[1].setAttribute("x2", getSvgCoord(event)[0]);
                    previewLineList[1].setAttribute("y2", getSvgCoord(event)[1]);
                    previewLineList[2].setAttribute("x1", getSvgCoord(event)[0]);
                    previewLineList[2].setAttribute("y1", getSvgCoord(event)[1]);
                    previewLineList[2].setAttribute("y2", getSvgCoord(event)[1]);
                    previewLineList[3].setAttribute("y1", getSvgCoord(event)[1]);
                }
            } else if (mouseMode === "middleDown") {
                event.preventDefault();
                let viewBoxOffsetXOld = (recentStartVertex[0] - svgViewbox.x1)/(svgViewbox.x2);
                let viewBoxOffsetYOld = (recentStartVertex[1] - svgViewbox.y1)/(svgViewbox.y2);
                let viewBoxOffsetXNew = (getSvgCoord(event)[0] - svgViewbox.x1)/(svgViewbox.x2);
                let viewBoxOffsetYNew = (getSvgCoord(event)[1] - svgViewbox.y1)/(svgViewbox.y2);
                svgViewbox.x1 += (viewBoxOffsetXOld - viewBoxOffsetXNew) * SVGHeight;
                svgViewbox.y1 += (viewBoxOffsetYOld - viewBoxOffsetYNew) * SVGHeight;
                svg.setAttribute("viewBox", `${svgViewbox.x1} ${svgViewbox.y1} ${svgViewbox.x2} ${svgViewbox.y2}`);
            }
        }

        const findNearestVertex = (x, y) => {
            let userX = x;
            let userY = y;
            let nearestGridX = Math.round(x / (10000 / gridSize)) * (10000 / gridSize);
            let nearestGridY = Math.round(y / (10000 / gridSize)) * (10000 / gridSize);
            let minGridDist = getAbsDist(userX, userY, nearestGridX, nearestGridY);
            let minVertex;
            let minVertexDist;
            if (vertices.length > 0) {
                minVertex = vertices[0];
                minVertexDist = getAbsDist(vertices[0][0], vertices[0][1], userX, userY); 
                for (const vertex of vertices) {
                    let testVertexDist = getAbsDist(vertex[0], vertex[1], userX, userY);
                    if (testVertexDist <= minVertexDist) {
                        minVertex = vertex;
                        minVertexDist = testVertexDist;
                    }
                }
            }
            if ((minVertex) && (minVertexDist < vertexSnapConstant * 10000 / gridSize)) {
                return minVertex;
            } else if (minGridDist < (vertexSnapConstant * 10000 / gridSize)) {
                return [nearestGridX, nearestGridY];
            } else {
                return [userX, userY];
            }
        }


        const getAbsDist = (x1, y1, x2, y2) => {
            return Math.hypot((x1 - x2), (y1 - y2));
        }
        
        const createToggleButtonLayout = (array, className) => {
            for (let i = 0; i < array.length; i++) {
                createButton(array, i, className);
            }
            const sketchButtons = document.querySelectorAll("." + className);
            for (const button of sketchButtons) {
                button.addEventListener("click", () => {
                    for (const btn of sketchButtons) {
                        btn.classList.remove("active")
                    }
                    button.classList.add("active");
                })
            }
            buttonOffset += Math.ceil(array.length / buttonRowCount) * buttonHeight;
        }
        
        const createButton = (array, id, className) => {
            const newButton = document.createElement(array[id].type);
            newButton.id = array[id].id;
            newButton.title = array[id].title;
            newButton.style.position = "absolute";
            newButton.classList.add(className);
            newButton.style.top = Math.floor(id / buttonRowCount) * buttonHeight + 10 + buttonOffset + "px";
            newButton.style.left = (id % buttonRowCount) * buttonWidth + 5 + "px";
            if (array[id].text != undefined) {
                newButton.innerHTML = array[id].text
            }

            if ((array[id].functionCall != undefined) && (array[id].type == "button")) {
                newButton.onclick = array[id].functionCall
            } else if ((array[id].functionCall != undefined) && (array[id].type == "input")) {
                newButton.onkeydown = array[id].functionCall;
            }

            if (array[id].icon != undefined) {
                newButton.appendChild(insertImg(array[id].icon))
            }
            buttonPanel.appendChild(newButton);
        }

        const insertImg = (fileName) => {
            const img = document.createElement("img");
            img.src = fileName;
            img.style.height = buttonHeight - 2 + "px";
            img.style.width = img.style.height;
            return img;
        }

        const getSvgCoord = (event) => {
            screenPoint = svg.createSVGPoint();
            screenPoint.x = event.clientX;
            screenPoint.y = event.clientY;
            svgPoint = screenPoint.matrixTransform(svg.getScreenCTM().inverse())
            return ([svgPoint.x, svgPoint.y]);
        }

		const cross2D = (a, b) => {
        	return (a[0] * b[1] - a[1] * b[0])
        }
        const sub = (a, b) => {
			let c = [];
    		for (let i in a) {
    			c.push(a[i] - b[i])
			}
    		return c;
    	}
        const mult = (a, k) => {
			let c = [];
    		for (let i in a) {
    			c.push(a[i] * k)
			}
    		return c;
    	}
        const add = (a, b) => {
			let c = [];
    		for (let i in a) {
    			c.push(a[i] + b[i])
			}
    		return c
    	}

        createSVG();
        const svg = document.querySelector("#crease-display");
        svg.style.setProperty("--line-width", lineWidth + "px")
        createGridLines();

        createToggleButtonLayout(creaseButton, "creaseButton");
        createGridButtonLayout();
        createLineWidthLayout();
        createToggleButtonLayout(toolButton, "toolButton");

  


        document.documentElement.style.setProperty("--button-width", buttonWidth + "px")
        document.documentElement.style.setProperty("--button-height", buttonHeight + "px")
        document.querySelector("#mountain").classList.add("active");
        document.querySelector("#input-grid").value = 2;
        document.querySelector("#line").classList.add("active");
        createLine(0    , 0    , 10000, 0    , "edge-line");
        createLine(10000, 0    , 10000, 10000, "edge-line");
        createLine(10000, 10000, 0    , 10000, "edge-line");
        createLine(0    , 10000, 0    , 0    , "edge-line");


        coordText = document.createElement("p");
        coordText.id = "coordText"
        coordText.style.position = "absolute"
        coordText.style.top = "40px"
        coordText.style.left = "265px"
        coordText.innerHTML = ""
        document.body.appendChild(coordText)

        //array display for debugging purposes
        debugText = document.createElement("p");
        debugText.id = "debugText"
        debugText.style.position = "absolute"
        debugText.style.top = "10px"
        debugText.style.left = "900px"
        debugText.innerHTML = "debug"
        const debugArr = (arr1, arr2, arr3) => {
            text = "vertices <br>";
            for (elmt of arr1) {
                text += "[" + elmt + "]" + "<br>"
            }
            text += "<br> edges <br>"
            for (elmt of arr2) {
                text += "[" + elmt + "]" + "<br>"
            }
            text += "<br> edges assignment <br>"

            for (elmt of arr3) {
                text += "'" + elmt + "'" + "<br>"
            }

            document.querySelector("#debugText").innerHTML = text

        }
        document.body.appendChild(debugText)
    </script>
